<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gazebo Terrain Generator</title>

    <!-- Mapbox GL JS -->
    <link href='https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.css' rel='stylesheet' />
    <script src='https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.js'></script>

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!-- Mapbox GL Draw -->
    <link rel="stylesheet" href="https://api.mapbox.com/mapbox-gl-js/plugins/mapbox-gl-draw/v1.4.3/mapbox-gl-draw.css">
    <script src="https://api.mapbox.com/mapbox-gl-js/plugins/mapbox-gl-draw/v1.4.3/mapbox-gl-draw.js"></script>

    <!-- Turf JS -->
    <script src="https://cdn.jsdelivr.net/npm/@turf/turf@6/turf.min.js"></script>

    <!-- Toastify JS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
    <script src="https://cdn.jsdelivr.net/npm/toastify-js"></script>

    <!-- Application CSS -->
    <link rel="stylesheet" href="css/main.css">
</head>
<body>
    <div id="app">
        <header>
            <h1>Gazebo Terrain Generator</h1>
        </header>

        <main>
            <div id="map">
                <div id="search-box" class="floating-search">
                    <input type="text" id="coordinate-input" placeholder="Enter coordinates (lat, lng)">
                    <button type="button" id="search-button">
                        <i class="fas fa-search"></i>
                    </button>
                </div>

                <div id="generate-btn-container" class="generate-btn-container">
                    <button id="generate-btn" class="generate-btn">
                        <i class="fas fa-globe"></i> Generate Terrain
                    </button>
                </div>

                <div id="texture-size-info" class="texture-size-info"></div>

                <div id="settings-panel" class="settings-panel">
                    <div class="settings-header">
                        <span class="settings-title">Settings</span>
                        <button id="settings-close-btn" class="settings-close-btn" title="Close">
                            <i class="fas fa-times"></i>
                        </button>
                    </div>
                    <div class="settings-body">

                        <div class="settings-field">
                            <label for="setting-zoom-level">Zoom Level <i class="fas fa-circle-info tooltip-icon" data-tooltip="Satellite tile resolution. Higher = more detail, more tiles to download. Affects texture quality in Gazebo."></i></label>
                            <input type="number" id="setting-zoom-level" value="17" min="1" max="22">
                        </div>

                        <div class="settings-field settings-field--row">
                            <label for="setting-include-buildings">Include Buildings <i class="fas fa-circle-info tooltip-icon" data-tooltip="Downloads OSM building footprints and extrudes them as 3D meshes. Increases generation time in dense urban areas."></i></label>
                            <label class="toggle-switch">
                                <input type="checkbox" id="setting-include-buildings" checked>
                                <span class="toggle-slider"></span>
                            </label>
                        </div>

                        <div class="settings-field settings-field--row">
                            <label for="setting-include-helipad">Include Helipad <i class="fas fa-circle-info tooltip-icon" data-tooltip="Spawns a helipad marker at the world origin (launch location) and, unless turned off under Spawn Points, at every additional spawn point."></i></label>
                            <label class="toggle-switch">
                                <input type="checkbox" id="setting-include-helipad">
                                <span class="toggle-slider"></span>
                            </label>
                        </div>

                        <div class="settings-field" id="setting-helipad-height-field" style="display:none;">
                            <label for="setting-helipad-height">Helipad Height (m) <i class="fas fa-circle-info tooltip-icon" data-tooltip="Height of the helipad above the terrain plane in meters."></i></label>
                            <input type="number" id="setting-helipad-height" value="3" min="0" step="0.5">
                        </div>

                        <div class="settings-field">
                            <label>Map Tile Source <i class="fas fa-circle-info tooltip-icon" data-tooltip="Satellite tile provider URL. Use {x}, {y}, {z} or {quad} as placeholders. Check provider terms before commercial use."></i></label>
                            <div class="source-field">
                                <button id="setting-source-display" class="source-display-btn" title="Click to change source"></button>
                                <button id="setting-source-presets-btn" title="Select from presets">
                                    <i class="fas fa-chevron-down"></i>
                                </button>
                            </div>
                            <input type="hidden" id="setting-tile-source" value="https://mt0.google.com/vt?lyrs=s&x={x}&s=&y={y}&z={z}">
                            <div id="source-presets-dropdown" class="source-presets-dropdown"></div>
                        </div>

                        <div class="settings-field">
                            <label for="setting-parallel-downloads">Parallel Downloads <i class="fas fa-circle-info tooltip-icon" data-tooltip="Concurrent tile download threads. Higher values speed up downloads but may trigger provider rate limiting."></i></label>
                            <input type="number" id="setting-parallel-downloads" value="4" min="1" max="16">
                        </div>

                        <div class="settings-field">
                            <label for="setting-gazebo-version">Target Gazebo Version <i class="fas fa-circle-info tooltip-icon" data-tooltip="Harmonic uses 16-bit heightmaps (65535 elevation levels). Fortress uses 8-bit (255 levels) due to a loader limitation in Ignition 6."></i></label>
                            <select id="setting-gazebo-version">
                                <option value="harmonic">Harmonic (and above) - (16-bit heightmap)</option>
                                <option value="fortress">Fortress / Citadel - (8-bit heightmap)</option>
                            </select>
                        </div>

                        <div class="settings-field">
                            <label for="setting-target-heightmap-size">Target Heightmap Size <i class="fas fa-circle-info tooltip-icon" data-tooltip="Output resolution of the heightmap PNG (must be 2^n+1). Auto picks the nearest valid size to raw DEM pixels. Larger sizes add interpolated detail. 4097x4097 requires a high-memory GPU."></i></label>
                            <select id="setting-target-heightmap-size">
                                <option value="auto">Auto (nearest to DEM resolution)</option>
                            </select>
                        </div>

                        <!-- Feature: multiple spawn points (multi-spawn) -->
                        <div id="spawn-settings" class="spawn-settings">
                            <div class="settings-field">
                                <label>Spawn Points <i class="fas fa-circle-info tooltip-icon" data-tooltip="Spawn 1 (red pin) is the world origin. Add more with the pin button on the map or below, then click inside the polygon. Drag a numbered marker to move it, right-click it to remove it. Each spawn point becomes an SDF frame (spawn_N) in the world and an entry in spawn_points.json. Yaw: degrees, counter-clockwise from east."></i></label>
                                <div id="spawn-points-list" class="spawn-points-list"></div>
                                <button type="button" id="setting-spawn-add-btn" class="spawn-add-btn">
                                    <i class="fas fa-plus"></i> Add spawn point
                                </button>
                            </div>
                            <div class="settings-field settings-field--row" id="setting-spawn-helipad-all-field" style="display:none;">
                                <label for="setting-spawn-helipad-all">Helipad at Every Spawn <i class="fas fa-circle-info tooltip-icon" data-tooltip="On: one helipad per spawn point. Off: only spawn point 1 gets a helipad; the others spawn on the ground."></i></label>
                                <label class="toggle-switch">
                                    <input type="checkbox" id="setting-spawn-helipad-all" checked>
                                    <span class="toggle-slider"></span>
                                </label>
                            </div>
                        </div>

                        <!-- Ground friction (roadmap: "Friction components to the ground") -->
                        <div id="friction-settings">
                            <div class="settings-field">
                                <label for="setting-friction-preset">Ground Surface <i class="fas fa-circle-info tooltip-icon" data-tooltip="Friction of the terrain and buildings (the helipad keeps its own). Each contact uses the lower of the ground's and the robot's coefficient (mu), so the ground cannot add grip a robot doesn't have. Gazebo default is mu = 1."></i></label>
                                <select id="setting-friction-preset">
                                    <option value="default" data-mu="1">Gazebo default (mu 1.0)</option>
                                    <option value="asphalt" data-mu="0.8">Asphalt, dry (mu 0.8)</option>
                                    <option value="concrete" data-mu="0.7">Concrete (mu 0.7)</option>
                                    <option value="dirt" data-mu="0.55">Dirt / gravel (mu 0.55)</option>
                                    <option value="sand" data-mu="0.4">Sand (mu 0.4)</option>
                                    <option value="grass" data-mu="0.35">Grass (mu 0.35)</option>
                                    <option value="snow" data-mu="0.2">Snow (mu 0.2)</option>
                                    <option value="ice" data-mu="0.1">Ice (mu 0.1)</option>
                                    <option value="custom">Custom</option>
                                </select>
                            </div>
                            <div class="settings-field">
                                <label for="setting-friction-coefficient">Friction Coefficient (mu) <i class="fas fa-circle-info tooltip-icon" data-tooltip="Coulomb friction coefficient used in both directions. Editing the value switches the surface to Custom."></i></label>
                                <input type="number" id="setting-friction-coefficient" value="1" min="0" step="0.05">
                                <p id="setting-friction-note" style="display:none; margin: 6px 0 0 0; color: rgba(255, 255, 255, 0.45); font-size: 11px; line-height: 1.4;"></p>
                            </div>
                        </div>

                        <!-- Smooth Roads (roadmap feature): flattens road corridors in the heightmap -->
                        <div id="roads-settings">
                            <div class="settings-field settings-field--row">
                                <label for="setting-roads-smooth">Smooth Roads <i class="fas fa-circle-info tooltip-icon" data-tooltip="Flattens roads across and smooths them along their length so vehicles drive on them properly. Uses OSM road centerlines from Mapbox; bridges, tunnels and footpaths are left alone."></i></label>
                                <label class="toggle-switch">
                                    <input type="checkbox" id="setting-roads-smooth" checked>
                                    <span class="toggle-slider"></span>
                                </label>
                            </div>
                            <div id="setting-roads-options">
                                <div class="settings-field">
                                    <label for="setting-roads-smoothing-length">Road Smoothing Length (m) <i class="fas fa-circle-info tooltip-icon" data-tooltip="Bumps along a road shorter than this are removed; longer grade changes are kept. Raise it (120-200 m) for mountain roads."></i></label>
                                    <input type="number" id="setting-roads-smoothing-length" value="80" min="10" max="1000" step="10">
                                </div>
                                <div class="settings-field">
                                    <label for="setting-roads-shoulder-width">Road Shoulder Width (m) <i class="fas fa-circle-info tooltip-icon" data-tooltip="Width of the blend from the road edge back to the natural terrain. Wider gives gentler embankments and cuts."></i></label>
                                    <input type="number" id="setting-roads-shoulder-width" value="4" min="0" max="100" step="0.5">
                                </div>
                            </div>
                        </div>

                        <!-- Trees: forest generated from the satellite texture's vegetation mask -->
                        <div id="trees-settings">
                            <div class="settings-field settings-field--row">
                                <label for="setting-trees-enabled">Include Trees <i class="fas fa-circle-info tooltip-icon" data-tooltip="Plants low-poly trees where the satellite texture shows tree canopy. Lawns, buildings, roads, water and the spawn point are kept clear. Trunks have collision; crowns are visual only."></i></label>
                                <label class="toggle-switch">
                                    <input type="checkbox" id="setting-trees-enabled" checked>
                                    <span class="toggle-slider"></span>
                                </label>
                            </div>

                            <div class="settings-field" id="setting-trees-density-field">
                                <label for="setting-trees-density">Tree Density (per hectare) <i class="fas fa-circle-info tooltip-icon" data-tooltip="Trees per hectare of detected canopy. 150 gives a closed-looking forest; lower it for open woodland. Every isolated canopy patch still gets one tree."></i></label>
                                <input type="number" id="setting-trees-density" value="150" min="1" max="1000" step="1">
                            </div>

                            <div class="settings-field" id="setting-trees-max-count-field">
                                <label for="setting-trees-max-count">Max Trees <i class="fas fa-circle-info tooltip-icon" data-tooltip="Upper limit on the number of trees, to keep Gazebo responsive. If the area needs more, the trees nearest the spawn point keep full density, the rest of the forest is thinned, and the console says so."></i></label>
                                <input type="number" id="setting-trees-max-count" value="20000" min="0" max="200000" step="1000">
                            </div>
                        </div>

                        <div class="settings-field settings-field--row">
                            <label>Mapbox API Key <i class="fas fa-circle-info tooltip-icon" data-tooltip="Required for satellite imagery, elevation data, and geocoding. Stored in your browser only - never sent to this server."></i></label>
                            <button id="setting-mapbox-key-btn" class="mapbox-key-btn">
                                <span id="setting-mapbox-key-status">Not set</span>
                                <i class="fas fa-edit"></i>
                            </button>
                        </div>

                        <button id="settings-revert-btn" class="settings-revert-btn">
                            <i class="fas fa-undo"></i> Revert to Defaults
                        </button>

                    </div>
                </div>
            </div>

            <!-- Sidebar commented out for now -->
            <!-- <aside id="sidebar">
                <div class="sidebar-content">
                    <h2>Welcome</h2>
                    <p>Loading map...</p>
                </div>
            </aside> -->
        </main>
    </div>

    <!-- API key modal -->
    <div id="apikey-modal-overlay" class="modal-overlay">
        <div class="name-modal">
            <div class="name-modal-header">
                <i class="fas fa-key"></i>
                <h2>Mapbox API Key</h2>
            </div>
            <p class="name-modal-hint">Paste your Mapbox public token below.<br>It is stored locally in your browser only.</p>
            <textarea id="apikey-modal-input" class="apikey-modal-input" placeholder="pk.eyJ1Ij..." rows="4" spellcheck="false"></textarea>
            <p id="apikey-modal-error" class="apikey-modal-error" style="display:none"></p>
            <div class="name-modal-actions">
                <button id="apikey-modal-cancel" class="name-modal-btn name-modal-btn--cancel">Cancel</button>
                <button id="apikey-modal-confirm" class="name-modal-btn name-modal-btn--confirm">
                    <i class="fas fa-check"></i> Save
                </button>
            </div>
        </div>
    </div>

    <!-- Name modal -->
    <div id="name-modal-overlay" class="modal-overlay">
        <div class="name-modal">
            <div class="name-modal-header">
                <i class="fas fa-globe"></i>
                <h2>Name Your World</h2>
            </div>
            <p class="name-modal-hint">Used as the output directory name.</p>
            <input type="text" id="name-modal-input" class="name-modal-input" placeholder="Generating suggestion...">
            <div class="name-modal-actions">
                <button id="name-modal-cancel" class="name-modal-btn name-modal-btn--cancel">Cancel</button>
                <button id="name-modal-confirm" class="name-modal-btn name-modal-btn--confirm">
                    <i class="fas fa-play"></i> Generate
                </button>
            </div>
        </div>
    </div>

    <!-- Console modal -->
    <div id="console-overlay" class="modal-overlay">
        <div class="console-modal">
            <div class="console-header">
                <span class="console-title"><i class="fas fa-terminal"></i> Terrain Generation</span>
                <span id="console-status-badge" class="console-status-badge">Running</span>
            </div>
            <div class="console-progress-wrap">
                <div id="console-progress-fill" class="console-progress-fill"></div>
            </div>
            <div id="console-progress-label" class="console-progress-label">0 / 0 tiles</div>
            <div id="console-log" class="console-log"></div>
            <div class="console-footer">
                <label id="console-intermediary-wrap" class="console-intermediary-wrap" style="display:none">
                    <input type="checkbox" id="console-intermediary-chk">
                    Include raw tiles
                </label>
                <button id="console-download-btn" class="console-download-btn" style="display:none">
                    <i class="fas fa-download"></i> Download World
                </button>
                <button id="console-stop-btn" class="console-stop-btn">
                    <i class="fas fa-stop"></i> Stop
                </button>
            </div>
        </div>
    </div>

    <!-- Application JavaScript -->
    <script src="js/main.js"></script>
</body>
</html>
